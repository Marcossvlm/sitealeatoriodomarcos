<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat ao Vivo</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('fruta3.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    /* Navbar Styles */
    .navbar {
      background: rgba(0, 100, 200, 0.7);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      backdrop-filter: blur(5px);
      z-index: 2;
      position: relative;
      transition: top 0.4s ease, opacity 0.4s ease;
    }

    .navbar.hidden {
      top: -200px;
      opacity: 0;
      position: absolute;
      width: 100%;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 3px #000;
      flex: 1;
      user-select: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
      user-select: none;
    }

    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
      color: #ffcc00;
    }

    /* Dropdown Styles */
    .dropdown-container {
      position: relative;
    }

    .dropdown-container > a {
      display: inline-block;
      user-select: none;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 100, 200, 0.9);
      border-radius: 8px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      min-width: 150px;
      z-index: 5;
    }

    .dropdown.show {
      max-height: 300px;
      opacity: 1;
    }

    .dropdown a {
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
      user-select: none;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* Toggle Navbar Button */
    .toggle-navbar-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.3s, transform 0.3s;
      user-select: none;
    }

    .toggle-navbar-btn:hover {
      background-color: rgba(255, 255, 255, 0.9);
      transform: rotate(90deg);
    }

    /* Chat Container */
    #chat-container {
      max-width: 600px;
      background-color: rgba(0, 0, 0, 0.6);
      margin: 30px auto;
      border-radius: 10px;
      padding: 20px;
      color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    #chat-container h2 {
      margin-bottom: 15px;
      user-select: none;
    }

    #chat {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .message {
      margin-bottom: 10px;
    }

    /* Inputs and button */
    #inputs-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      user-select: none;
    }

    input#nameInput {
      flex: 1 1 45%;
      min-width: 140px;
    }

    input#messageInput {
      flex: 2 1 50%;
      min-width: 180px;
    }

    button {
      background-color: rgba(0, 100, 200, 0.8);
      color: white;
      cursor: pointer;
      flex: 1 1 100%;
      transition: background-color 0.3s;
      min-width: 100px;
    }

    button:hover {
      background-color: rgba(0, 100, 200, 1);
    }

    /* Scrollbar styling for chat */
    #chat::-webkit-scrollbar {
      width: 8px;
    }

    #chat::-webkit-scrollbar-thumb {
      background-color: rgba(0, 100, 200, 0.7);
      border-radius: 4px;
    }

    /* Responsive for tablets and phones */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .navbar h1 {
        font-size: 22px;
        text-align: center;
        margin-bottom: 10px;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      .nav-links a {
        width: 100%;
        text-align: center;
        padding: 10px 0;
      }

      .dropdown {
        left: 0;
        transform: none;
        min-width: 100%;
        border-radius: 0 0 8px 8px;
      }

      .toggle-navbar-btn {
        display: block;
      }

      #inputs-row {
        flex-direction: column;
      }

      input#nameInput,
      input#messageInput,
      button {
        flex: 1 1 100%;
        min-width: auto;
      }
    }

    @media (max-width: 480px) {
      .navbar h1 {
        font-size: 20px;
      }

      .nav-links a {
        font-size: 16px;
      }

      #chat {
        height: 250px;
        font-size: 14px;
      }

      button {
        font-size: 16px;
        padding: 12px;
      }
    }
  </style>

  <!-- Firebase scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Navbar toggle button -->
  <button class="toggle-navbar-btn" onclick="toggleNavbar()">▲</button>

  <!-- Navbar -->
  <div class="navbar" id="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a>
      <div class="dropdown-container">
        <a onclick="toggleDropdown()" style="cursor:pointer;">Meus Jogos </a>
        <div id="dropdown" class="dropdown">
          <a href="tu.html">Nehum jogo :/</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="jojo.html">Chat (AO VIVO)</a>
      <a href="jumpiscare.html">NÃO CLIQUE</a>
    </div>
  </div>

  <!-- Chat container -->
  <div id="chat-container">
    <h2>💬 Chat ao Vivo</h2>

    <div id="inputs-row">
      <input id="nameInput" placeholder="Seu nome" autocomplete="off" />
      <input id="messageInput" placeholder="Digite sua mensagem" autocomplete="off" />
      <button onclick="sendMessage()">Enviar</button>
    </div>

    <div id="chat"></div>
  </div>

  <script>
    // Toggle dropdown menu
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    // Close dropdown if click outside
    window.addEventListener('click', function (e) {
      const dropdown = document.getElementById('dropdown');
      const dropdownContainer = document.querySelector('.dropdown-container');
      if (!dropdownContainer.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    // Toggle Navbar visibility
    function toggleNavbar() {
      const navbar = document.getElementById('navbar');
      const toggleBtn = document.querySelector('.toggle-navbar-btn');
      if (navbar.classList.contains('hidden')) {
        navbar.classList.remove('hidden');
        toggleBtn.textContent = '▲';
      } else {
        navbar.classList.add('hidden');
        toggleBtn.textContent = '▼';
      }
    }

    // Firebase config (atualize com seu próprio config)
    const firebaseConfig = {
  apiKey: "AIzaSyDdnY9299WMH7VsY_9Kgg0mYh4PWe2yJeE",
  authDomain: "sitechat-89fca.firebaseapp.com",
  databaseURL: "https://sitechat-89fca-default-rtdb.firebaseio.com",
  projectId: "sitechat-89fca",
  storageBucket: "sitechat-89fca.firebasestorage.app",
  messagingSenderId: "377335909727",
  appId: "1:377335909727:web:a27d33c82664594444baea",
  measurementId: "G-3LWYFS8P56"
};


    // Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const chatRef = database.ref('messages');

    // Enviar mensagem para Firebase
    function sendMessage() {
      const nameInput = document.getElementById('nameInput');
      const messageInput = document.getElementById('messageInput');
      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !message) {
        alert('Por favor, preencha seu nome e mensagem.');
        return;
      }

      const newMessage = {
        name,
        message,
        timestamp: Date.now()
      };

      chatRef.push(newMessage);
      messageInput.value = '';
      messageInput.focus();
    }

    // Exibir mensagens do Firebase em tempo real
    const chatDiv = document.getElementById('chat');
    chatRef.limitToLast(50).on('value', snapshot => {
      chatDiv.innerHTML = '';
      const data = snapshot.val();
      if (!data) {
        chatDiv.innerHTML = '<p style="text-align:center;opacity:0.6;">Sem mensagens ainda.</p>';
        return;
      }
      const messages = Object.values(data);
      messages.sort((a, b) => a.timestamp - b.timestamp);

      messages.forEach(({ name, message }) => {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message');
        messageDiv.innerHTML = `<strong>${escapeHtml(name)}:</strong> ${escapeHtml(message)}`;
        chatDiv.appendChild(messageDiv);
      });
      chatDiv.scrollTop = chatDiv.scrollHeight;
    });

    // Função para escapar HTML e evitar XSS
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
  <audio src="chatando.mp3" autoplay hidden></audio>
</body>
</html>
