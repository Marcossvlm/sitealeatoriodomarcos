<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Aleatório do Marcos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('fruta.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(0, 100, 200, 0.7);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      backdrop-filter: blur(5px);
      z-index: 2;
      position: relative;
      transition: top 0.4s ease, opacity 0.4s ease;
    }

    .navbar.hidden {
      top: -200px;
      opacity: 0;
      position: absolute;
      width: 100%;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 3px #000;
      flex: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
      color: #ffcc00;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-container > a {
      display: inline-block;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 100, 200, 0.9);
      border-radius: 8px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      min-width: 150px;
      z-index: 5;
    }

    .dropdown.show {
      max-height: 300px;
      opacity: 1;
    }

    .dropdown a {
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .center-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .floating-title {
      font-family: 'Comic Neue', 'Comic Sans MS', cursive;
      font-size: 50px;
      color: #ffffff;
      text-shadow: 2px 2px 5px #000;
      animation: float 3s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 15px;
      font-size: 22px;
      font-weight: 300;
      color: #eeeeee;
      text-shadow: 1px 1px 3px #000;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .toggle-navbar-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      z-index: 5;
      transition: background-color 0.3s, transform 0.3s;
    }

    .toggle-navbar-btn:hover {
      background-color: rgba(255, 255, 255, 0.9);
      transform: rotate(90deg);
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .navbar h1 {
        font-size: 22px;
        text-align: center;
        margin-bottom: 10px;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      .nav-links a {
        width: 100%;
        text-align: center;
        padding: 10px 0;
      }

      .floating-title {
        font-size: 38px;
      }

      .subtitle {
        font-size: 18px;
      }

      .toggle-navbar-btn {
        display: block;
      }
    }

    @media (max-width: 480px) {
      .floating-title {
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }

      .nav-links a {
        font-size: 16px;
      }

      .dropdown {
        min-width: 100px;
      }
    }
  </style>
</head>

<body>
  <button class="toggle-navbar-btn" onclick="toggleNavbar()">▲</button>

  <div class="navbar" id="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a>
      <div class="dropdown-container">
        <a onclick="toggleDropdown()">Meus Jogos</a>
        <div id="dropdown" class="dropdown">
          <a href="tu.html">Nehum jogo :/</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="jojo.html">Chat</a>
      <a href="jumpiscare.html">NÃO CLIQUE</a>
    </div>
  </div>

  <div class="center-title">
    <div class="floating-title">SITE ALEATÓRIO DO MARCOS</div>
    <div class="subtitle">Sim, esse site existe</div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    document.addEventListener('click', function (event) {
      const dropdown = document.getElementById('dropdown');
      const container = document.querySelector('.dropdown-container');
      if (!container.contains(event.target)) {
        dropdown.classList.remove('show');
      }
    });

    function toggleNavbar() {
      const navbar = document.getElementById('navbar');
      const btn = document.querySelector('.toggle-navbar-btn');

      navbar.classList.toggle('hidden');

      if (navbar.classList.contains('hidden')) {
        btn.innerText = '▼';
      } else {
        btn.innerText = '▲';
      }
    }
  </script>

  <audio id="meuAudio" src="calma.mp3" autoplay hidden></audio>

<script>
  const audio = document.getElementById('meuAudio');
  audio.volume = 0.45; // volume entre 0 e 1
</script>
</body>
</html>
