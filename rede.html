<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-image: url('fruta2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: rgba(0, 100, 200, 0.7);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            backdrop-filter: blur(5px);
            z-index: 2;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            transition: top 0.4s ease, opacity 0.4s ease;
        }
        .navbar.hidden { top: -80px; opacity: 0; pointer-events: none; }
        .navbar h1 {
            font-size: 24px;
            text-shadow: 1px 1px 3px #000;
            flex: 1;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-links a:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
            color: #ffcc00;
        }
        .dropdown-container {
            position: relative;
        }
        .dropdown-container > a {
            display: inline-block;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 100, 200, 0.9);
            border-radius: 8px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            min-width: 150px;
            z-index: 5;
        }
        .dropdown.show { max-height: 300px; opacity: 1; }
        .dropdown a {
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.3s;
        }
        .dropdown a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        /* Novo: Título "REDES" centralizado abaixo da navbar */
        .page-title {
            margin-top: 80px; /* espaço para navbar fixa */
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: #66c0f4;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            font-family: 'Comic Neue', cursive;
            padding-bottom: 30px;
            user-select: none;
        }
        .center-title {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            padding: 0 20px 30px;
            flex-wrap: wrap;
        }
        .card {
            padding: 20px;
            border: 3px solid #66c0f4;
            border-radius: 15px;
            background: linear-gradient(to bottom right, #1b2838, #171a21);
            color: #c7d5e0;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 15px #66c0f4;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #66c0f4;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .card h2 {
            margin: 10px 0;
            color: #66c0f4;
        }
        .card a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #66c0f4;
            color: #1b2838;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 10px #66c0f4;
            transition: 0.3s;
            cursor: pointer;
        }
        .card a:hover {
            box-shadow: 0 0 20px #66c0f4;
        }
        .toggle-navbar-btn {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #000;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            transition: background-color 0.3s, transform 0.3s;
        }
        .toggle-navbar-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: rotate(90deg);
        }
        @media (max-width: 768px) {
            .toggle-navbar-btn { display: block; }
            .navbar { flex-direction: column; align-items: center; }
            .navbar h1 { font-size: 22px; text-align: center; margin-bottom: 10px; }
            .nav-links { flex-direction: column; width: 100%; gap: 10px; }
            .nav-links a { width: 100%; text-align: center; padding: 10px 0; }
            .center-title { flex-direction: column; align-items: center; padding-top: 0; }
        }
        @media (max-width: 480px) {
            .card { width: 95%; }
        }
    </style>
</head>

<body>

    <script>
        const audio = document.getElementById('meuAudio');
        audio.volume = 0.45;
    </script>

    <button class="toggle-navbar-btn" onclick="toggleNavbar()">▲</button>

    <div class="navbar" id="navbar">
        <h1>SITE ALEATÓRIO DO MARCOS</h1>
        <div class="nav-links">
            <a href="tu.html">Home</a>

                <a onclick="toggleDropdown()">Meus Jogos</a>

     <br>

        <div id="youtube-card" class="card">

            <img id="steam-avatar" src="x.jpg" alt="Erro" />
            <h2 id="steam-name">Marcoss0502</h2>
            <br>
            <a id="steam-link" href="https://x.com/Marcoss0502" target="_blank" rel="noopener noreferrer">Ver perfil no Twitter</a>
        </div>
    </div>

    <script>
        // Funções de UI
        function toggleDropdown() {
            const dropdown = document.getElementById('dropdown');
            dropdown.classList.toggle('show');
        }

        document.addEventListener('click', function (event) {
            const dropdown = document.getElementById('dropdown');
            const container = document.querySelector('.dropdown-container');
            if (!container.contains(event.target)) {
                dropdown.classList.remove('show');
            }
        });

        function toggleNavbar() {
            const navbar = document.getElementById('navbar');
            const btn = document.querySelector('.toggle-navbar-btn');
            navbar.classList.toggle('hidden');
            btn.innerText = navbar.classList.contains('hidden') ? '▼' : '▲';
        }

        // --- YouTube API ---
        const youtubeApiKey = 'AIzaSyASXn2WJOGdMDmbMx_fPiotcfGBbE9qfo8'; // <--- SUBSTITUA PELA SUA NOVA CHAVE DO YOUTUBE
        const youtubeChannelId = 'UC_LvmUYYdStFT9u73KC4BsQ'; // <--- SUBSTITUA PELO ID CORRETO DO SEU CANAL (ex: 'UCwFh8kvtkxZK_4APy6WbgCg')

        async function fetchYouTubeData() {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&id=${youtubeChannelId}&key=${youtubeApiKey}`
                );

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Erro na resposta da API do YouTube:', response.status, response.statusText, errorData);
                    let errorMessage = `Erro ao carregar YouTube (Status: ${response.status}).`;
                    if (errorData.error && errorData.error.message) {
                        errorMessage += ` Detalhe: ${errorData.error.message}`;
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();
                const channel = data.items[0];

                if (channel) {
                    document.getElementById('youtube-name').innerText = channel.snippet.title;
                    document.getElementById('youtube-avatar').src = channel.snippet.thumbnails.high.url;
                    document.getElementById('youtube-subs').innerText = Number(channel.statistics.subscriberCount).toLocaleString('pt-BR');
                    document.getElementById('youtube-link').href = `https://www.youtube.com/@Marcoss0502`; // Mantido o link que você tinha
                } else {
                    document.getElementById('youtube-name').innerText = 'Canal não encontrado.';
                    document.getElementById('youtube-avatar').src = 'erro.png';
                    document.getElementById('youtube-subs').innerText = 'erro ao conectar';
                    document.getElementById('youtube-link').href = 'https://www.youtube.com/@Marcoss0502'; // Mantido o link que você tinha
                }
            } catch (error) {
                console.error('Erro ao buscar dados do YouTube (catch final):', error);
                document.getElementById('youtube-name').innerText = 'Marcoss0502';
                document.getElementById('youtube-avatar').src = 'erro.png';
                document.getElementById('youtube-subs').innerText = 'erro ao conectar';
                document.getElementById('youtube-link').href = ''; // Link vazio ou para uma página de erro
            }
        }

        // Carregar dados ao carregar a página
        window.addEventListener('load', () => {
            // A função fetchSteamData foi removida, não há necessidade de chamá-la.
            fetchYouTubeData();
        });
        // Desativado por enquanto para evitar sobrecarga durante o debug:
        // setInterval(fetchYouTubeData, 10000);
        // setInterval(fetchSteamData, 10000); // Esta linha foi removida, se estiver em cache pode precisar limpar.
    </script>
</body>
