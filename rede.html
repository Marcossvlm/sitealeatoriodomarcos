<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Aleatório do Marcos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('fruta.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(0, 100, 200, 0.6);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(5px);
      flex-wrap: wrap;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      transition: top 0.5s ease;
      z-index: 1000;
    }

    .navbar.hide {
      top: -200px;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 2px #000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      color: #ffcc00;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 100, 200, 0.85);
      border-radius: 5px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.4s ease;
    }

    .dropdown.show {
      max-height: 150px;
      opacity: 1;
    }

    .dropdown a {
      color: white;
      padding: 5px 10px;
      text-decoration: none;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .center-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      margin-top: 120px;
    }

    .floating-title, .rgb-text {
      font-family: 'Comic Neue', 'Comic Sans MS', cursive;
      font-size: 48px;
      text-shadow: 2px 2px 4px #000;
      animation: float 3s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 300;
      color: #eeeeee;
      text-shadow: 1px 1px 2px #000;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    .rgb-text {
      font-size: 64px;
      animation: rgb-glow 1.5s infinite alternate;
    }

    @keyframes rgb-glow {
      0% { color: #ff0000; }
      25% { color: #00ff00; }
      50% { color: #0000ff; }
      75% { color: #ff00ff; }
      100% { color: #ffff00; }
    }

    .rotate-effect {
      display: inline-block;
      transition: transform 0.5s ease;
    }

    .rotate-effect:hover {
      transform: rotate(360deg);
    }

    .links-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .links-container a {
      text-decoration: none;
      color: #ff0004;
      font-weight: bold;
      font-size: 24px;
      transition: transform 0.5s ease;
    }

    .links-container a:hover {
      transform: rotate(360deg);
    }

    /* Botão de esconder navbar */
    .toggle-button {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 100, 200, 0.8);
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 24px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      transition: background 0.3s ease;
    }

    .toggle-button:hover {
      background: rgba(0, 100, 200, 1);
    }

    @media (max-width: 768px) {
      .toggle-button {
        display: block;
      }

      .navbar {
        padding: 10px 20px;
      }

      .center-title {
        margin-top: 130px;
      }

      .rgb-text {
        font-size: 48px;
      }

      .links-container a {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .rgb-text {
        font-size: 36px;
      }

      .links-container a {
        font-size: 18px;
      }

      .navbar h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="navbar" id="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a>
      <div class="dropdown-container">
        <a onclick="toggleDropdown()">Meus Jogos</a>
        <div id="dropdown" class="dropdown">
          <a href="mouselouko.html">Mouse Louko</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="https://www.erro404.com">NÃO CLIQUE</a>
    </div>
  </div>

  <button class="toggle-button" onclick="toggleNavbar()">▲</button>

  <div class="center-title">
    <div class="rgb-text">REDES</div>
    <div class="links-container">
      <a href="https://www.youtube.com/seucanal" class="rotate-effect">Canal do YouTube</a>
      <a href="https://www.youtube.com/seucanalsecundario" class="rotate-effect">Canal Secundário</a>
      <a href="https://www.instagram.com/seuinstagram" class="rotate-effect">Instagram</a>
      <a href="https://www.twitter.com/seutwitter" class="rotate-effect">Twitter</a>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('dropdown');
      const container = document.querySelector('.dropdown-container');
      if (!container.contains(event.target)) {
        dropdown.classList.remove('show');
      }
    });

    function toggleNavbar() {
      const navbar = document.getElementById('navbar');
      const button = document.querySelector('.toggle-button');

      navbar.classList.toggle('hide');

      if (navbar.classList.contains('hide')) {
        button.innerHTML = '▼';
      } else {
        button.innerHTML = '▲';
      }
    }
  </script>
</body>
</html>
