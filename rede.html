<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Aleatório do Marcos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('fruta.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(0, 100, 200, 0.6);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(5px);
      position: relative;
      z-index: 2;
    }

    .navbar h1 {
      margin: 0;
      font-size: 24px;
      text-shadow: 1px 1px 2px #000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      position: relative;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      color: #ffcc00;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 100, 200, 0.85);
      border-radius: 5px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.4s ease;
    }

    .dropdown.show {
      max-height: 100px;
      opacity: 1;
    }

    .dropdown a {
      color: white;
      padding: 5px 10px;
      text-decoration: none;
      transition: background 0.3s;
      white-space: nowrap;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .center-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: -80px;
      text-align: center;
    }

    .floating-title {
      font-family: 'Comic Neue', 'Comic Sans MS', cursive;
      font-size: 48px;
      color: #ffffff;
      text-shadow: 2px 2px 4px #000;
      animation: float 3s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 300;
      color: #eeeeee;
      text-shadow: 1px 1px 2px #000;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }

    /* Efeito RGB brilhante */
    .rgb-text {
      font-size: 64px;
      font-weight: bold;
      color: #fff;
      animation: rgb-glow 1.5s infinite alternate;
    }

    @keyframes rgb-glow {
      0% {
        color: #ff0000;
      }
      25% {
        color: #00ff00;
      }
      50% {
        color: #0000ff;
      }
      75% {
        color: #ff00ff;
      }
      100% {
        color: #ffff00;
      }
    }

    /* Efeito de rotação nos links */
    .rotate-effect {
      display: inline-block;
      transition: transform 0.5s ease;
    }

    .rotate-effect:hover {
      transform: rotate(360deg);
    }

    /* Estilo dos links abaixo */
    .links-container {
      margin-top: 50px;
    }

    .links-container a {
      display: block;
      margin: 10px 0;
      font-weight: bold;
      text-decoration: none;
      color: #ff0004;
      font-size: 24px;
      transition: transform 0.5s ease;
    }

    .links-container a:hover {
      transform: rotate(360deg);
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a> <!-- Aqui foi corrigido -->
      <div class="dropdown-container">
        <a onclick="toggleDropdown()">Meus Jogos</a>
        <div id="dropdown" class="dropdown">
          <a href="mouselouko.html">Mouse Louko</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="https://www.erro404.com">NÃO CLIQUE</a>
    </div>
  </div>

  <!-- Texto central com o efeito RGB -->
  <div class="center-title">
    <div class="rgb-text">REDES</div>
    <div class="links-container">
      <a href="https://www.youtube.com/seucanal" class="rotate-effect">Canal do YouTube</a>
      <a href="https://www.youtube.com/seucanalsecundario" class="rotate-effect">Canal Secundário</a>
      <a href="https://www.instagram.com/seuinstagram" class="rotate-effect">Instagram</a>
      <a href="https://www.twitter.com/seutwitter" class="rotate-effect">Twitter</a>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    document.addEventListener('click', function (event) {
      const dropdown = document.getElementById('dropdown');
      const container = document.querySelector('.dropdown-container');
      if (!container.contains(event.target)) {
        dropdown.classList.remove('show');
      }
    });
  </script>
</body>
</html>
