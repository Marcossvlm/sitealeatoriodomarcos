<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redes</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-image: url('fruta2.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: rgba(0, 100, 200, 0.7);
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      backdrop-filter: blur(5px);
      z-index: 2;
      position: relative;
      transition: top 0.4s ease, opacity 0.4s ease;
    }

    .navbar.hidden {
      top: -200px;
      opacity: 0;
      position: absolute;
      width: 100%;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 3px #000;
      flex: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-links a:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
      color: #ffcc00;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-container > a {
      display: inline-block;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(0, 100, 200, 0.9);
      border-radius: 8px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease;
      min-width: 150px;
      z-index: 5;
    }

    .dropdown.show {
      max-height: 300px;
      opacity: 1;
    }

    .dropdown a {
      color: white;
      padding: 8px 16px;
      text-decoration: none;
      text-align: center;
      transition: background-color 0.3s;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .center-title {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      gap: 20px;
    }

    .floating-title {
      font-family: 'Comic Neue', 'Comic Sans MS', cursive;
      font-size: 50px;
      color: #ffffff;
      text-shadow: 2px 2px 5px #000;
      animation: float 3s ease-in-out infinite;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .links-container a {
      text-decoration: none;
      color: #ff0004;
      font-weight: bold;
      font-size: 24px;
      transition: transform 0.4s ease;
    }

    .links-container a:hover {
      transform: rotate(360deg);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .toggle-navbar-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      background-color: rgba(255, 255, 255, 0.7);
      color: #000;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      z-index: 5;
      transition: background-color 0.3s, transform 0.3s;
    }

    .toggle-navbar-btn:hover {
      background-color: rgba(255, 255, 255, 0.9);
      transform: rotate(90deg);
    }

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: center;
      }

      .navbar h1 {
        font-size: 22px;
        text-align: center;
        margin-bottom: 10px;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      .nav-links a {
        width: 100%;
        text-align: center;
        padding: 10px 0;
      }

      .floating-title {
        font-size: 38px;
      }

      .links-container a {
        font-size: 20px;
      }

      .toggle-navbar-btn {
        display: block;
      }
    }

    @media (max-width: 480px) {
      .floating-title {
        font-size: 30px;
      }

      .links-container a {
        font-size: 18px;
      }

      .nav-links a {
        font-size: 16px;
      }

      .dropdown {
        min-width: 100px;
      }
    }

    @keyframes rainbowGlow {
      0% { color: red; text-shadow: 0 0 5px red, 0 0 10px red; }
      14% { color: orange; text-shadow: 0 0 5px orange, 0 0 10px orange; }
      28% { color: yellow; text-shadow: 0 0 5px yellow, 0 0 10px yellow; }
      42% { color: green; text-shadow: 0 0 5px green, 0 0 10px green; }
      57% { color: cyan; text-shadow: 0 0 5px cyan, 0 0 10px cyan; }
      71% { color: blue; text-shadow: 0 0 5px blue, 0 0 10px blue; }
      85% { color: violet; text-shadow: 0 0 5px violet, 0 0 10px violet; }
      100% { color: red; text-shadow: 0 0 5px red, 0 0 10px red; }
    }
  </style>
</head>

<body>

  <div class="center-title">
  <div 
    style="
      padding: 20px;
      border: 3px solid #66c0f4;
      border-radius: 15px;
      background: linear-gradient(to bottom right, #1b2838, #171a21);
      color: #c7d5e0;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 15px #66c0f4;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    "
  >
    <img id="steam-avatar" src="" alt="Avatar Steam" style="width:100px;height:100px;border-radius:50%;border:2px solid #66c0f4;margin-bottom:10px;">
    <h2 id="steam-name" style="margin:10px 0;color:#66c0f4;">Carregando...</h2>
    <p>Nível: <strong id="steam-level">?</strong></p>
    <a 
      id="steam-link"
      href="#" 
      target="_blank" 
      style="
        display:inline-block;
        padding:10px 20px;
        background-color:#66c0f4;
        color:#1b2838;
        font-weight:bold;
        border-radius:8px;
        text-decoration:none;
        box-shadow:0 0 10px #66c0f4;
        transition:0.3s;
      "
    >
      Ver perfil na Steam
    </a>
  </div>
</div>

<script>
  const steamId = '76561198981104653';
  const apiKey = 'AAD4F39E9A2B617D0C541D6491E3CC37';

  async function fetchSteamData() {
    try {
      const profileRes = await fetch(`https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v2/?key=${apiKey}&steamids=${steamId}`);
      const profileData = await profileRes.json();
      const player = profileData.response.players[0];

      document.getElementById('steam-avatar').src = player.avatarfull;
      document.getElementById('steam-name').innerText = player.personaname;
      document.getElementById('steam-link').href = player.profileurl;

      const levelRes = await fetch(`https://api.steampowered.com/IPlayerService/GetSteamLevel/v1/?key=${apiKey}&steamid=${steamId}`);
      const levelData = await levelRes.json();
      document.getElementById('steam-level').innerText = levelData.response.player_level;
    } catch (error) {
      console.error('Erro ao carregar dados da Steam:', error);
      document.getElementById('steam-name').innerText = "Erro ao carregar";
    }
  }

  window.addEventListener('load', fetchSteamData);
</script>


  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    document.addEventListener('click', function (event) {
      const dropdown = document.getElementById('dropdown');
      const container = document.querySelector('.dropdown-container');
      if (!container.contains(event.target)) {
        dropdown.classList.remove('show');
      }
    });

    function toggleNavbar() {
      const navbar = document.getElementById('navbar');
      const btn = document.querySelector('.toggle-navbar-btn');

      navbar.classList.toggle('hidden');
      btn.innerText = navbar.classList.contains('hidden') ? '▼' : '▲';
    }
  </script>
</body>
