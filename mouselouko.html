<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Botão Móvel</title>
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Estilo geral do body */
    body {
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      color: #fff;
      cursor: url('https://upload.wikimedia.org/wikipedia/commons/5/56/Mouse_pointer.ico'), auto;
      animation: shake 0.3s infinite;
    }

    /* Navbar */
    .navbar {
      background: rgba(0, 100, 200, 0.6);
      padding: 10px 20px;
      width: 100%;
      position: fixed;
      top: -80px;
      left: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(5px);
      z-index: 10;
      transition: top 0.5s ease, opacity 0.5s ease;
      opacity: 0;
    }

    .navbar.show {
      top: 0;
      opacity: 1;
    }

    .navbar.hide {
      top: -80px;
      opacity: 0;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 2px #000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #ffcc00;
      transform: scale(1.1);
    }

    /* Dropdown */
    .dropdown-container {
      position: relative;
    }

    .dropdown {
      display: none;
      position: absolute;
      top: 30px;
      left: 0;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 5px;
      padding: 10px;
    }

    .dropdown a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 8px 12px;
      font-weight: bold;
      margin-bottom: 5px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    .dropdown a:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #ffcc00;
    }

    /* Botão de jogo */
    .game-button {
      position: absolute;
      background: #ff6347;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      z-index: 5;
      transition: left 0.8s ease, top 0.8s ease;
    }

    .game-button:active {
      transform: scale(0.9);
    }

    /* Contador */
    .counter {
      font-size: 40px;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      z-index: 2;
    }

    /* Botões Mostrar/Esconder Navbar */
    .show-navbar-btn, .hide-navbar-btn {
      position: absolute;
      left: 20px;
      background: #ff6347;
      border: none;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      z-index: 10;
    }

    .show-navbar-btn {
      top: 20px;
    }

    .hide-navbar-btn {
      top: 70px;
      display: none;
    }

    /* Animação de tremor */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .game-button {
        padding: 12px 24px;
        font-size: 16px;
      }

      .counter {
        font-size: 30px;
      }

      .navbar h1 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Barra de Navegação -->
  <div class="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a>
      <div class="dropdown-container">
        <a href="javascript:void(0)" onclick="toggleDropdown()">Meus Jogos</a>
        <div id="dropdown" class="dropdown">
          <a href="mouselouko.html">Mouse Louko</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="https://www.erro404.com">NÃO CLIQUE</a>
    </div>
  </div>

  <!-- Botões de controle da Navbar -->
  <button class="show-navbar-btn" onclick="toggleNavbar()">Mostrar Barra</button>
  <button class="hide-navbar-btn" id="hide-navbar-btn" onclick="toggleNavbar()">Esconder Barra</button>

  <!-- Contador -->
  <div class="counter" id="counter">Contador: 0</div>

  <!-- Botão do Jogo -->
  <button class="game-button" onclick="moveButton()">Clique Aqui!</button>

  <script>
    let count = 0;

    function moveButton() {
      count++;
      document.getElementById("counter").innerText = `Contador: ${count}`;

      const button = document.querySelector('.game-button');
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const randomX = Math.random() * (screenWidth - button.offsetWidth);
      const randomY = Math.random() * (screenHeight - button.offsetHeight);

      button.style.left = `${randomX}px`;
      button.style.top = `${randomY}px`;
    }

    function toggleNavbar() {
      const navbar = document.querySelector('.navbar');
      const showButton = document.querySelector('.show-navbar-btn');
      const hideButton = document.querySelector('.hide-navbar-btn');

      if (navbar.classList.contains('hide') || !navbar.classList.contains('show')) {
        navbar.classList.remove('hide');
        navbar.classList.add('show');
        showButton.style.display = "none";
        hideButton.style.display = "block";
      } else {
        navbar.classList.remove('show');
        navbar.classList.add('hide');
        showButton.style.display = "block";
        hideButton.style.display = "none";
      }
    }

    function toggleDropdown() {
      const dropdown = document.getElementById("dropdown");
      dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
    }

    // Inicialização
    document.getElementById("dropdown").style.display = "none";
    document.querySelector('.hide-navbar-btn').style.display = "none";

    // Efeito de fugir do botão
    const button = document.querySelector('.game-button');
    button.addEventListener('mouseenter', () => {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const randomX = Math.random() * (screenWidth - button.offsetWidth);
      const randomY = Math.random() * (screenHeight - button.offsetHeight);

      button.style.left = `${randomX}px`;
      button.style.top = `${randomY}px`;
    });
  </script>

</body>
</html>
