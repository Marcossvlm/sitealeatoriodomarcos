<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Botão Móvel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      min-height: 100vh;
      position: relative;
      color: #fff;
      cursor: url('https://upload.wikimedia.org/wikipedia/commons/5/56/Mouse_pointer.ico'), auto;
      animation: shake 0.3s infinite;
    }

    /* Navbar fixa no topo */
    .navbar {
      background: rgba(0, 100, 200, 0.7);
      backdrop-filter: blur(5px);
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transition: top 0.4s ease, opacity 0.4s ease;
    }

    .navbar.hidden {
      top: -100px;
      opacity: 0;
    }

    .navbar h1 {
      font-size: 24px;
      text-shadow: 1px 1px 2px #000;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.3);
      color: #ffcc00;
      transform: scale(1.1);
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 100, 200, 0.95);
      border-radius: 8px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      min-width: 150px;
      z-index: 5;
    }

    .dropdown.show {
      opacity: 1;
      visibility: visible;
    }

    .dropdown a {
      color: white;
      padding: 8px 16px;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .dropdown a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* Botão da setinha */
    .toggle-navbar-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.7);
      color: #000;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s, background 0.3s;
    }

    .toggle-navbar-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: rotate(90deg);
    }

    /* Contador */
    .counter {
      font-size: 40px;
      text-align: center;
      margin-top: 120px;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }

    /* Botão de jogo */
    .game-button {
      background: #ff6347;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: left 0.8s ease, top 0.8s ease;
      z-index: 500;
    }

    .game-button:active {
      transform: translate(-50%, -50%) scale(0.9);
    }

    /* Animação de tremor */
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }

    /* Responsividade */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 10px;
        padding: 10px 15px;
      }

      .nav-links {
        flex-direction: column;
        width: 100%;
        text-align: center;
      }

      .nav-links a {
        width: 100%;
      }

      .game-button {
        padding: 12px 24px;
        font-size: 16px;
      }

      .counter {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <button class="toggle-navbar-btn" id="toggle-btn" onclick="toggleNavbar()">▲</button>

  <div class="navbar" id="navbar">
    <h1>SITE ALEATÓRIO DO MARCOS</h1>
    <div class="nav-links">
      <a href="tu.html">Home</a>
      <div class="dropdown-container">
        <a href="javascript:void(0)" onclick="toggleDropdown()">Meus Jogos</a>
        <div id="dropdown" class="dropdown">
          <a href="mouselouko.html">Mouse Louko</a>
        </div>
      </div>
      <a href="rede.html">Redes</a>
      <a href="https://www.erro404.com">NÃO CLIQUE</a>
    </div>
  </div>

  <div class="counter" id="counter">Contador: 0</div>

  <button class="game-button" onclick="moveButton()">Clique Aqui!</button>

  <script>
    let count = 0;

    function moveButton() {
      count++;
      document.getElementById("counter").innerText = `Contador: ${count}`;

      const button = document.querySelector('.game-button');
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const randomX = Math.random() * (screenWidth - button.offsetWidth);
      const randomY = Math.random() * (screenHeight - button.offsetHeight);

      button.style.left = `${randomX}px`;
      button.style.top = `${randomY}px`;
    }

    function toggleNavbar() {
      const navbar = document.getElementById('navbar');
      const btn = document.getElementById('toggle-btn');

      navbar.classList.toggle('hidden');
      if (navbar.classList.contains('hidden')) {
        btn.innerText = '▼';
      } else {
        btn.innerText = '▲';
      }
    }

    function toggleDropdown() {
      const dropdown = document.getElementById('dropdown');
      dropdown.classList.toggle('show');
    }

    // Fecha dropdown clicando fora
    document.addEventListener('click', function (e) {
      const dropdown = document.getElementById('dropdown');
      const container = document.querySelector('.dropdown-container');
      if (!container.contains(e.target)) {
        dropdown.classList.remove('show');
      }
    });

    // Efeito de fugir do botão
    const button = document.querySelector('.game-button');
    button.addEventListener('mouseenter', () => {
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const randomX = Math.random() * (screenWidth - button.offsetWidth);
      const randomY = Math.random() * (screenHeight - button.offsetHeight);

      button.style.left = `${randomX}px`;
      button.style.top = `${randomY}px`;
    });
  </script>
</body>
</html>
